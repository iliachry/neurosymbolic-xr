<body>
  <div id="stage-wrap">
    <canvas id="stage" width="1920" height="1080"></canvas>
  </div>
  <div id="controls">
    <button id="play-btn">▶ Play</button>
    <select id="mode-select">
      <option value="main">Main Video (11 Scenes)</option>
      <option value="60s">60s Social Cut</option>
      <option value="30s">30s Teaser Cut</option>
      <option value="15s">15s Reels/Stories Cut</option>
      <option value="thumbnail">YouTube Thumbnail (1920x1080)</option>
    </select>
    <input type="range" id="scrub" min="0" max="186" step="0.033" value="0" />
    <span class="time-label" id="time-display">00:00.0 / 03:06.0</span>
  </div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const W = 1920;
const H = 1080;

// Check URL params for headless mode
const params = new URLSearchParams(window.location.search);
if (params.get('headless') === '1') {
  document.body.classList.add('headless');
}

// Style Guide Colors from ANTIGRAVITY_BRIEF.md
const COLORS = {
  bgDark: '#12141c',
  bgPanel: '#1a1d28',
  bgCard: 'rgba(26, 30, 44, 0.88)',
  neural: '#1E90FF',
  neuralLight: '#60B5FF',
  neuralGlow: 'rgba(30, 144, 255, 0.35)',
  symbolic: '#FFD700',
  symbolicLight: '#FFE55C',
  symbolicGlow: 'rgba(255, 215, 0, 0.35)',
  success: '#00FF66',
  successGlow: 'rgba(0, 255, 102, 0.3)',
  textMain: '#FFFFFF',
  textMuted: '#94A3B8',
  textDim: '#64748B',
  border: 'rgba(255, 255, 255, 0.12)'
};

const FONTS = {
  title: "'Montserrat', 'Inter', -apple-system, sans-serif",
  body: "'Inter', -apple-system, sans-serif",
  code: "'Fira Code', 'JetBrains Mono', 'Menlo', monospace"
};

// Default fallback timeline if scene_timings.json isn't injected yet
let TIMELINE = {
  main: {
    total_duration: 186.0,
    scenes: [
      { id: 1, key: 'opening', title: 'Opening Title', start: 0, end: 10, duration: 10, vo_text: "Introducing the Neurosymbolic XR Framework—a breakthrough in Extended Reality AI that combines the power of deep learning with logical reasoning." },
      { id: 2, key: 'architecture', title: 'Architecture Overview', start: 10, end: 27, duration: 17, vo_text: "The framework features a layered architecture. Sensors feed into neural networks for perception, which are grounded into symbolic representations for reasoning. This bidirectional bridge enables both bottom-up understanding and top-down validation." },
      { id: 3, key: 'spatial_reasoning', title: 'System 1: Spatial Reasoning', start: 27, end: 49, duration: 22, vo_text: "System One: Spatial Reasoning. We capture the scene with 3D Gaussian Splatting, segment objects with SAM 2, and ground them to language with CLIP. The result? A queryable scene graph that understands both geometry and semantics." },
      { id: 4, key: 'hybrid_slam', title: 'System 2: Hybrid SLAM', start: 49, end: 71, duration: 22, vo_text: "System Two: Hybrid SLAM. Visual-inertial tracking provides precise localization at 60 frames per second. But unlike traditional SLAM, we maintain semantic memory—objects are remembered across sessions, building a persistent understanding of the environment." },
      { id: 5, key: 'training_assistant', title: 'System 3: VR Training Assistant', start: 71, end: 93, duration: 22, vo_text: "System Three: VR Training Assistant. Hand and gaze tracking feed into Prolog-based procedural reasoning. Each action is validated against logical preconditions and constraints, providing real-time feedback to guide users through complex procedures." },
      { id: 6, key: 'asset_generator', title: 'System 4: Asset Generator', start: 93, end: 115, duration: 22, vo_text: "System Four: Neural-Symbolic Asset Generator. Natural language descriptions are combined with geometric constraints. Z3 validates feasibility, then Stable Diffusion generates the asset. The result? AI-created content that satisfies both aesthetic and functional requirements." },
      { id: 7, key: 'poetics_integration', title: 'Poetics Platform Integration', start: 115, end: 133, duration: 18, vo_text: "All four systems integrate seamlessly with the Poetics VR platform. A unified API manages sessions, tracks users, stores semantic memory in Supabase, and provides real-time events. Everything you need for intelligent VR experiences." },
      { id: 8, key: 'performance_metrics', title: 'Performance Metrics', start: 133, end: 147, duration: 14, vo_text: "Performance is critical for XR. The framework achieves sub-20 millisecond tracking latency, real-time scene understanding, and fast asset generation—all while running complex AI models." },
      { id: 9, key: 'tech_stack', title: 'Technical Stack', start: 147, end: 162, duration: 15, vo_text: "Built on cutting-edge technologies: 3D Gaussian Splatting for rendering, SAM 2 for segmentation, CLIP for grounding, and Stable Diffusion for generation. Symbolic reasoning with RDF, Prolog, and Z3. All integrated with Supabase and OpenXR." },
      { id: 10, key: 'call_to_action', title: 'Call to Action', start: 162, end: 178, duration: 16, vo_text: "Ready to build intelligent VR experiences? The Neurosymbolic XR Framework is open source and production-ready. Visit the GitHub repository for the source code, architecture documentation, and interactive demo. Transform your VR applications with the power of neurosymbolic AI." },
      { id: 11, key: 'closing', title: 'Closing', start: 178, end: 186, duration: 8, vo_text: "Neurosymbolic XR Framework. The future of intelligent Extended Reality." }
    ]
  },
  cuts: {}
};

window.setTimelineData = function(data) {
  TIMELINE = data;
};

// Utility math & easing functions
function clamp(v, min = 0, max = 1) { return Math.max(min, Math.min(max, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutCubic(t) { const x = clamp(t); return 1 - Math.pow(1 - x, 3); }
function easeInOutCubic(t) {
  const x = clamp(t);
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
}
function smoothStep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0));
  return t * t * (3 - 2 * t);
}

// Deterministic pseudo-random generator
function seededRandom(seed) {
  let x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

// Precompute 3D particles & graph nodes for scenes
const NODES_OPENING = [];
for (let i = 0; i < 64; i++) {
  const theta = seededRandom(i * 3 + 1) * Math.PI * 2;
  const phi = Math.acos(2 * seededRandom(i * 3 + 2) - 1);
  const r = 160 + seededRandom(i * 3 + 3) * 180;
  // Neural cloud position (organic sphere)
  const nx = r * Math.sin(phi) * Math.cos(theta);
  const ny = r * Math.sin(phi) * Math.sin(theta) * 0.75;
  const nz = r * Math.cos(phi);

  // Symbolic graph position (structured hierarchical lattice)
  const layer = i % 4;
  const idxInLayer = Math.floor(i / 4);
  const angle = (idxInLayer / 16) * Math.PI * 2;
  const ringR = 95 + layer * 75;
  const sx = Math.cos(angle) * ringR * 1.25;
  const sy = (layer - 1.5) * 115 + Math.sin(angle * 2) * 22;
  const sz = Math.sin(angle) * ringR * 0.6;

  const labels = ['Entity', 'Table', 'Chair', 'Laptop', 'Stage', 'Door', 'ON(x,y)', 'NEAR(x,y)', 'Graspable', 'Sittable', 'Pose6D', 'Z3_Valid', 'PrologRule', 'SAM2_Mask', 'CLIP_Vec', 'Gaussian3D'];
  NODES_OPENING.push({
    nx, ny, nz, sx, sy, sz,
    label: labels[i % labels.length],
    isMajor: i % 5 === 0
  });
}

// Precompute 3D Gaussian Splatting point cloud for Scene 3
const SPLATS_3D = [];
// Table surface + 4 legs + Chair + Laptop + Cup + Book
for (let i = 0; i < 420; i++) {
  let x, y, z, objType, color;
  if (i < 170) {
    // Table top & legs
    objType = 'table';
    color = '#1E90FF';
    x = (seededRandom(i * 7) - 0.5) * 280;
    z = (seededRandom(i * 7 + 1) - 0.5) * 180;
    y = 40 + (seededRandom(i * 7 + 2) - 0.5) * 14;
  } else if (i < 270) {
    // Chair near table
    objType = 'chair';
    color = '#38BDF8';
    x = -190 + (seededRandom(i * 7) - 0.5) * 90;
    z = 40 + (seededRandom(i * 7 + 1) - 0.5) * 90;
    y = (i < 220 ? 50 : -20) + (seededRandom(i * 7 + 2) - 0.5) * 55;
  } else if (i < 350) {
    // Laptop on table
    objType = 'laptop';
    color = '#00FF66';
    x = -20 + (seededRandom(i * 7) - 0.5) * 75;
    z = -10 + (seededRandom(i * 7 + 1) - 0.5) * 55;
    y = 5 - seededRandom(i * 7 + 2) * 45;
  } else if (i < 390) {
    // Book on table
    objType = 'book';
    color = '#FFD700';
    x = 75 + (seededRandom(i * 7) - 0.5) * 50;
    z = 25 + (seededRandom(i * 7 + 1) - 0.5) * 40;
    y = 25 + (seededRandom(i * 7 + 2) - 0.5) * 10;
  } else {
    // Cup on table
    objType = 'cup';
    color = '#F472B6';
    x = 55 + (seededRandom(i * 7) - 0.5) * 28;
    z = -35 + (seededRandom(i * 7 + 1) - 0.5) * 28;
    y = 15 + (seededRandom(i * 7 + 2) - 0.5) * 30;
  }
  // Initial scattered position
  const sx = (seededRandom(i * 11) - 0.5) * 520;
  const sy = (seededRandom(i * 11 + 1) - 0.5) * 360;
  const sz = (seededRandom(i * 11 + 2) - 0.5) * 420;
  SPLATS_3D.push({ x, y, z, sx, sy, sz, objType, color, r: 4 + seededRandom(i * 13) * 6 });
}

// Drawing helpers
function drawRoundedRect(x, y, w, h, r, fill, stroke, strokeWidth = 1.5) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  if (stroke) {
    ctx.lineWidth = strokeWidth;
    ctx.strokeStyle = stroke;
    ctx.stroke();
  }
}

function drawGlowCircle(x, y, r, color, glowRadius = 20) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = glowRadius;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBadge(x, y, text, bgColor, textColor = '#fff', borderColor = null) {
  ctx.save();
  ctx.font = `700 15px ${FONTS.body}`;
  const padX = 16;
  const w = ctx.measureText(text).width + padX * 2;
  const h = 34;
  drawRoundedRect(x, y, w, h, 17, bgColor, borderColor || bgColor, 1.5);
  ctx.fillStyle = textColor;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + padX, y + h / 2 + 1);
  ctx.restore();
  return w;
}

function drawBackground(globalTime) {
  // Deep dark tech radial gradient (#1a1a1a base with subtle neural blue & symbolic gold ambient corners)
  const grad = ctx.createRadialGradient(W * 0.5, H * 0.45, 100, W * 0.5, H * 0.5, W * 0.75);
  grad.addColorStop(0, '#1e2230');
  grad.addColorStop(0.6, '#151821');
  grad.addColorStop(1, '#0e1017');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Ambient corner blooms
  const blueGlow = ctx.createRadialGradient(250, 200, 10, 250, 200, 620);
  blueGlow.addColorStop(0, 'rgba(30, 144, 255, 0.11)');
  blueGlow.addColorStop(1, 'rgba(30, 144, 255, 0)');
  ctx.fillStyle = blueGlow;
  ctx.fillRect(0, 0, W, H);

  const goldGlow = ctx.createRadialGradient(W - 250, H - 200, 10, W - 250, H - 200, 620);
  goldGlow.addColorStop(0, 'rgba(255, 215, 0, 0.08)');
  goldGlow.addColorStop(1, 'rgba(255, 215, 0, 0)');
  ctx.fillStyle = goldGlow;
  ctx.fillRect(0, 0, W, H);

  // Subtle perspective grid
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
  ctx.lineWidth = 1;
  const gridSize = 60;
  const offset = (globalTime * 12) % gridSize;
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = offset; y < H; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawTopBar(sceneId, sceneTitle, globalTime, totalDuration, mode) {
  ctx.save();
  drawRoundedRect(48, 28, W - 96, 64, 14, 'rgba(20, 24, 36, 0.85)', 'rgba(255, 255, 255, 0.1)', 1);

  // Left logo pill
  drawGlowCircle(82, 60, 10, COLORS.neural, 12);
  drawGlowCircle(98, 60, 10, COLORS.symbolic, 12);
  ctx.font = `800 20px ${FONTS.title}`;
  ctx.fillStyle = '#fff';
  ctx.textBaseline = 'middle';
  ctx.fillText('NEUROSYMBOLIC XR', 122, 61);

  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(365, 44, 1.5, 32);

  // Scene indicator
  ctx.font = `600 18px ${FONTS.body}`;
  ctx.fillStyle = COLORS.symbolic;
  const badgeText = mode === 'main' ? `SCENE ${String(sceneId).padStart(2, '0')} / 11` : `SHOWCASE (${mode.toUpperCase()})`;
  ctx.fillText(badgeText, 388, 61);

  ctx.font = `600 18px ${FONTS.body}`;
  ctx.fillStyle = '#E2E8F0';
  ctx.fillText(`—  ${sceneTitle}`, 545, 61);

  // Right status & progress
  const pct = clamp(globalTime / Math.max(1, totalDuration));
  const barW = 240;
  const barX = W - 96 - barW - 30;
  const barY = 55;
  drawRoundedRect(barX, barY, barW, 10, 5, 'rgba(255,255,255,0.1)', null);
  const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
  grad.addColorStop(0, COLORS.neural);
  grad.addColorStop(1, COLORS.symbolic);
  drawRoundedRect(barX, barY, Math.max(10, barW * pct), 10, 5, grad, null);

  ctx.font = `500 14px ${FONTS.code}`;
  ctx.fillStyle = COLORS.textMuted;
  ctx.textAlign = 'right';
  ctx.fillText('POETICS VR PLATFORM // AI CORE', barX - 24, 61);
  ctx.restore();
}

function drawSubtitleBar(voText, sceneProgress) {
  if (!voText) return;
  ctx.save();
  ctx.font = `500 23px ${FONTS.body}`;
  const maxWidth = 1460;
  const words = voText.split(' ');
  const lines = [];
  let currentLine = '';
  for (const w of words) {
    const test = currentLine ? currentLine + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth) {
      lines.push(currentLine);
      currentLine = w;
    } else {
      currentLine = test;
    }
  }
  if (currentLine) lines.push(currentLine);

  const boxH = lines.length * 34 + 26;
  const boxY = H - boxH - 24;
  drawRoundedRect(W / 2 - 780, boxY, 1560, boxH, 14, 'rgba(12, 15, 24, 0.88)', 'rgba(255, 215, 0, 0.28)', 1.5);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  // Highlight words progressively based on sceneProgress
  const totalChars = voText.length;
  const activeChar = Math.floor(clamp((sceneProgress - 0.04) / 0.88) * totalChars);

  let charCount = 0;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const ly = boxY + 13 + i * 34;
    ctx.fillStyle = '#F8FAFC';
    ctx.fillText(line, W / 2, ly);
    charCount += line.length + 1;
  }
  ctx.restore();
}

// ============================================================================
// SCENE 1 & 11: OPENING & CLOSING (Neural Network -> Symbolic Graph Morph)
// ============================================================================
function renderSceneOpeningOrClosing(p, globalTime, isClosing = false) {
  const morph = isClosing ? easeInOutCubic(clamp(p * 1.4)) : easeInOutCubic(clamp((p - 0.12) * 1.45));
  const cx = W * 0.5;
  const cy = H * 0.44;
  const rotY = globalTime * 0.45;

  // Project 3D nodes
  const projected = NODES_OPENING.map((n, idx) => {
    const x3 = lerp(n.nx, n.sx, morph);
    const y3 = lerp(n.ny, n.sy, morph);
    const z3 = lerp(n.nz, n.sz, morph);
    const cosY = Math.cos(rotY);
    const sinY = Math.sin(rotY);
    const rx = x3 * cosY - z3 * sinY;
    const rz = x3 * sinY + z3 * cosY;
    const fov = 700 / (700 + rz + 250);
    return {
      x: cx + rx * fov,
      y: cy + y3 * fov,
      z: rz,
      scale: fov,
      label: n.label,
      isMajor: n.isMajor,
      idx
    };
  });

  // Draw edges
  ctx.save();
  for (let i = 0; i < projected.length; i++) {
    for (let j = i + 1; j < projected.length; j++) {
      const a = projected[i];
      const b = projected[j];
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dist = Math.hypot(dx, dy);
      const maxDist = lerp(155, 190, morph);
      if (dist < maxDist && (i + j) % 3 === 0) {
        const alpha = (1 - dist / maxDist) * 0.45;
        ctx.strokeStyle = morph < 0.5
          ? `rgba(30, 144, 255, ${alpha})`
          : `rgba(255, 215, 0, ${alpha})`;
        ctx.lineWidth = morph > 0.5 && a.isMajor && b.isMajor ? 2.2 : 1.2;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();

        // Data packet traveling along edge
        const pulse = (globalTime * 0.9 + (i * 0.13)) % 1;
        const px = lerp(a.x, b.x, pulse);
        const py = lerp(a.y, b.y, pulse);
        ctx.fillStyle = pulse < 0.5 ? COLORS.neuralLight : COLORS.symbolic;
        ctx.beginPath();
        ctx.arc(px, py, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Draw nodes
  for (const pt of projected) {
    const isGold = morph > 0.55 || (morph > 0.3 && pt.idx % 2 === 0);
    const col = isGold ? COLORS.symbolic : COLORS.neural;
    const radius = (pt.isMajor ? 8.5 : 4.8) * pt.scale;
    drawGlowCircle(pt.x, pt.y, radius, col, pt.isMajor ? 18 : 8);

    if (pt.isMajor && morph > 0.35) {
      ctx.font = `600 ${Math.round(13 * pt.scale)}px ${FONTS.code}`;
      ctx.fillStyle = `rgba(255, 240, 180, ${clamp((morph - 0.35) * 2)})`;
      ctx.fillText(pt.label, pt.x + 12, pt.y + 4);
    }
  }
  ctx.restore();

  // Left & Right Paradigm Indicators
  drawBadge(110, 150, '● NEURAL PERCEPTION (3DGS • SAM 2 • CLIP)', 'rgba(30, 144, 255, 0.18)', COLORS.neuralLight, COLORS.neural);
  drawBadge(W - 560, 150, '◆ SYMBOLIC REASONING (RDF • PROLOG • Z3)', 'rgba(255, 215, 0, 0.18)', COLORS.symbolicLight, COLORS.symbolic);

  // Center Hero Title Card
  ctx.save();
  const cardY = 670;
  drawRoundedRect(W / 2 - 620, cardY, 1240, 230, 24, 'rgba(16, 20, 32, 0.86)', 'rgba(255, 255, 255, 0.18)', 2);

  ctx.textAlign = 'center';
  ctx.font = `800 58px ${FONTS.title}`;
  const titleGrad = ctx.createLinearGradient(W / 2 - 450, 0, W / 2 + 450, 0);
  titleGrad.addColorStop(0, '#60B5FF');
  titleGrad.addColorStop(0.5, '#FFFFFF');
  titleGrad.addColorStop(1, '#FFD700');
  ctx.fillStyle = titleGrad;
  ctx.fillText('NEUROSYMBOLIC XR FRAMEWORK', W / 2, cardY + 82);

  ctx.font = `500 28px ${FONTS.body}`;
  ctx.fillStyle = '#E2E8F0';
  ctx.fillText(
    isClosing
      ? 'The Future of Intelligent Extended Reality • Built with ❤️ for the Poetics VR Platform'
      : 'Bridging Continuous Neural Perception with Formal Symbolic Reasoning for VR',
    W / 2,
    cardY + 138
  );

  ctx.font = `600 18px ${FONTS.code}`;
  ctx.fillStyle = COLORS.success;
  ctx.fillText('4 INTERCONNECTED AI SYSTEMS  •  <20ms XR LATENCY  •  BIDIRECTIONAL GROUNDING', W / 2, cardY + 188);
  ctx.restore();
}

// ============================================================================
// SCENE 2: ARCHITECTURE OVERVIEW (5 Sequential Layers + Bidirectional Bridge)
// ============================================================================
function renderSceneArchitecture(p, globalTime) {
  const layers = [
    { name: '5. APPLICATION LAYER', sub: 'Poetics VR Platform • Venue Intelligence • Multi-User Sessions', color: '#00FF66', y: 145 },
    { name: '4. SYMBOLIC REASONING LAYER', sub: 'RDF/OWL Scene Graphs • SWI-Prolog Logic Engine • Z3 SMT Constraint Solver', color: '#FFD700', y: 295 },
    { name: '3. BIDIRECTIONAL GROUNDING BRIDGE', sub: 'Neural→Symbolic Entity/Relation Extraction  ⇄  Symbolic→Neural Top-Down Validation', color: '#38BDF8', y: 445 },
    { name: '2. NEURAL PERCEPTION LAYER', sub: '3D Gaussian Splatting (gsplat) • Meta SAM 2 Segmentation • OpenAI CLIP (ViT-L/14)', color: '#1E90FF', y: 595 },
    { name: '1. XR SENSOR STREAM LAYER', sub: 'Multi-View RGB-D Cameras • 6-DOF Visual-Inertial IMU • 21-Joint Hand & Eye Gaze Tracking', color: '#818CF8', y: 745 }
  ];

  // Left side: 5-layer animated stack (appear bottom-up 1 -> 5)
  const stackX = 80;
  const stackW = 1040;
  const boxH = 112;

  for (let i = 0; i < layers.length; i++) {
    // Bottom-up appearance order: index 4 appears first, index 0 appears last
    const appearOrder = 4 - i;
    const localP = easeOutCubic(clamp((p - appearOrder * 0.11) * 3.2));
    if (localP <= 0.01) continue;

    const L = layers[i];
    ctx.save();
    ctx.globalAlpha = localP;
    const slideX = stackX - (1 - localP) * 40;
    drawRoundedRect(slideX, L.y, stackW, boxH, 16, 'rgba(22, 27, 42, 0.92)', L.color, 2.2);

    // Left accent bar
    drawRoundedRect(slideX, L.y, 12, boxH, 6, L.color, null);

    ctx.font = `800 24px ${FONTS.title}`;
    ctx.fillStyle = L.color;
    ctx.fillText(L.name, slideX + 34, L.y + 44);

    ctx.font = `500 19px ${FONTS.body}`;
    ctx.fillStyle = '#F1F5F9';
    ctx.fillText(L.sub, slideX + 34, L.y + 82);
    ctx.restore();

    // Animated bidirectional connectors between layers
    if (i < layers.length - 1) {
      const nextY = layers[i + 1].y;
      const midY1 = L.y + boxH;
      const midY2 = nextY;
      // Upward blue particles (bottom-up perception) & downward gold particles (top-down validation)
      for (let k = 0; k < 4; k++) {
        const upX = stackX + 260 + k * 140;
        const downX = stackX + 320 + k * 140;
        const tUp = (globalTime * 1.8 + k * 0.25) % 1;
        const tDown = (globalTime * 1.8 + k * 0.25) % 1;
        drawGlowCircle(upX, lerp(midY2, midY1, tUp), 4.5, COLORS.neural, 10);
        drawGlowCircle(downX, lerp(midY1, midY2, tDown), 4.5, COLORS.symbolic, 10);
      }
    }
  }

  // Right side: Live Grounding Bridge Code & Telemetry Panel
  const rightX = 1165;
  const rightW = 685;
  drawRoundedRect(rightX, 145, rightW, 712, 18, 'rgba(16, 20, 30, 0.95)', 'rgba(56, 189, 248, 0.4)', 2);
  drawBadge(rightX + 28, 172, 'src/core/bridge.py — Bidirectional Grounding', 'rgba(30, 144, 255, 0.2)', COLORS.neuralLight, COLORS.neural);

  const codeLines = [
    { c: '#94A3B8', t: '# Bottom-Up: Neural Tensor -> Symbolic RDF Graph' },
    { c: '#60B5FF', t: 'def ground_neural_to_symbolic(self, splats, masks):' },
    { c: '#F8FAFC', t: '    entities = self.clip.classify_regions(splats, masks)' },
    { c: '#F8FAFC', t: '    for e1, e2 in itertools.permutations(entities, 2):' },
    { c: '#FFD700', t: '        rel = self.infer_spatial_predicate(e1.bbox, e2.bbox)' },
    { c: '#00FF66', t: '        if rel.confidence >= 0.85:' },
    { c: '#00FF66', t: '            self.rdf_graph.add((e1.uri, rel.pred, e2.uri))' },
    { c: '#94A3B8', t: '' },
    { c: '#94A3B8', t: '# Top-Down: Symbolic Constraints -> Neural Prior' },
    { c: '#FFD700', t: 'def validate_symbolic_constraints(self, proposal):' },
    { c: '#F8FAFC', t: '    prolog_ok = self.prolog.query(proposal.action)' },
    { c: '#F8FAFC', t: '    z3_sat = self.z3_solver.check(proposal.geometry)' },
    { c: '#00FF66', t: '    return GroundingResult(valid=(prolog_ok and z3_sat))' }
  ];

  ctx.save();
  ctx.font = `500 18px ${FONTS.code}`;
  for (let i = 0; i < codeLines.length; i++) {
    ctx.fillStyle = codeLines[i].c;
    ctx.fillText(codeLines[i].t, rightX + 30, 248 + i * 32);
  }

  // Bottom right live diagram of the 4 systems fed by the bridge
  drawRoundedRect(rightX + 28, 675, rightW - 56, 155, 14, 'rgba(255, 215, 0, 0.07)', 'rgba(255, 215, 0, 0.35)', 1.5);
  ctx.font = `700 17px ${FONTS.title}`;

  ctx.fillText('UNIFIED REASONING BRIDGE POWERS 4 REAL-TIME SYSTEMS:', rightX + 50, 710);

  const sysBadges = ['1. Spatial Reasoning', '2. Hybrid SLAM', '3. Training Assistant', '4. Asset Generator'];

    drawBadge(bx, by, sysBadges[i], 'rgba(30, 144, 255, 0.22)', '#fff', COLORS.neural);

  const optProgress = clamp(p * 2.2);
  const iterCount = Math.floor(optProgress * 10000);
  ctx.save();
  ctx.font = `600 16px ${FONTS.code}`;
  ctx.fillStyle = COLORS.success;
  ctx.fillText(`3DGS Optimization: ${iterCount.toLocaleString()} / 10,000 iters  |  Gaussians: 100,000`, lx + 26, ly + 78);

  // Render 3D Gaussian splats converging into scene objects
  const cx = lx + lw * 0.5;
  const cy = ly + lh * 0.56;

  const converge = easeOutCubic(clamp(p * 2.0));

  for (const sp of SPLATS_3D) {

    const y3 = lerp(sp.sy, sp.y, converge);
    const z3 = lerp(sp.sz, sp.z, converge);
    const rx = x3 * Math.cos(rot) - z3 * Math.sin(rot);
    const rz = x3 * Math.sin(rot) + z3 * Math.cos(rot);
    const scale = 550 / (550 + rz + 220);
    const px = cx + rx * scale;
    const py = cy + y3 * scale;

    ctx.fillStyle = sp.color;
    ctx.globalAlpha = 0.68;
    ctx.beginPath();
    ctx.ellipse(px, py, sp.r * scale * 1.4, sp.r * scale * 0.9, rot * 0.5, 0, Math.PI * 2);
    ctx.fill();

    { id: 'laptop', label: 'entity_2: laptop\n[2.5, 1.0, -1.0]', x: rx + 220, y: ry + 165, c: COLORS.success },
    { id: 'chair', label: 'entity_0: chair\n[2.3, 0.5, -1.2]', x: rx + 195, y: ry + 450, c: '#38BDF8' },

    { id: 'cup', label: 'entity_4: cup\n[2.6, 1.0, -1.1]', x: rx + 675, y: ry + 435, c: '#F472B6' }
  ];
  const gEdges = [

  // Right Column: 3D Diffusion Synthesis & 4 Constraint-Verified Variations

  ctx.save();
  const cx = rx + rw * 0.5;
  const cy = ry + 265;
  const rot = globalTime * 0.9;

  // Draw stylized rotating 3D office chair geometry
  function proj3D(x, y, z) {
    const rx3 = x * Math.cos(rot) - z * Math.sin(rot);
    const rz3 = x * Math.sin(rot) + z * Math.cos(rot);
    const s = 420 / (420 + rz3);
    return [cx + rx3 * s, cy + y * s];
  }

  ctx.strokeStyle = COLORS.neuralLight;
  ctx.lineWidth = 3;
  // Seat square
  const seat = [[-65, 15, -65], [65, 15, -65], [65, 15, 65], [-65, 15, 65]];
  ctx.beginPath();
  seat.forEach((pt, idx) => {
    const [px, py] = proj3D(...pt);
    if (idx === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.closePath();
  ctx.stroke();

  // Backrest
  const back = [[-60, 15, -65], [60, 15, -65], [55, -110, -75], [-55, -110, -75]];
  ctx.strokeStyle = COLORS.symbolic;
  ctx.beginPath();
  back.forEach((pt, idx) => {
    const [px, py] = proj3D(...pt);
    if (idx === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.closePath();
  ctx.stroke();

  // Central stem + 5 wheel legs
  const [sx0, sy0] = proj3D(0, 15, 0);
  const [sx1, sy1] = proj3D(0, 95, 0);
  ctx.strokeStyle = COLORS.success;
  ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(sx1, sy1); ctx.stroke();
  for (let w = 0; w < 5; w++) {
    const ang = (w / 5) * Math.PI * 2;
    const [wx, wy] = proj3D(Math.cos(ang) * 75, 105, Math.sin(ang) * 75);
    ctx.beginPath(); ctx.moveTo(sx1, sy1); ctx.lineTo(wx, wy); ctx.stroke();
    drawGlowCircle(wx, wy, 5, COLORS.symbolic, 8);
  }

  // 4 Variations Grid at bottom of Right Panel
  const vars = [
    { title: 'Variation A: Minimalist Mesh', score: 'Z3 Score: 0.99 ✓', col: COLORS.neural },
    { title: 'Variation B: Executive Leather', score: 'Z3 Score: 0.97 ✓', col: COLORS.symbolic },
    { title: 'Variation C: Cyber Studio', score: 'Z3 Score: 0.98 ✓', col: COLORS.success },
    { title: 'Variation D: Matte Architectural', score: 'Z3 Score: 0.96 ✓', col: '#38BDF8' }
  ];
  for (let i = 0; i < 4; i++) {
    const vx = rx + 34 + (i % 2) * 418;
    const vy = ry + 455 + Math.floor(i / 2) * 155;
    drawRoundedRect(vx, vy, 398, 138, 14, 'rgba(24, 30, 46, 0.92)', vars[i].col, 2);

    ctx.fillStyle = COLORS.textMuted;
    ctx.fillText('0.6m × 1.0m × 0.6m • Y-Symmetry', vx + 22, vy + 110);
  }
  ctx.restore();
}

    case 6: return renderSceneAssetGenerator(localProgress, globalTime);
    case 7: return renderScenePoeticsIntegration(localProgress, globalTime);
    case 8: return renderScenePerformanceMetrics(localProgress, globalTime);

    case 10: return renderSceneCTA(localProgress, globalTime);
    case 11: return renderSceneOpeningOrClosing(localProgress, globalTime, true);
    default: return renderSceneOpeningOrClosing(localProgress, globalTime, false);
  }
}

window.renderAtTime = function(t, mode = 'main') {
  if (mode === 'thumbnail') {
    renderThumbnail();
    return;
  }

  drawBackground(t);

  if (mode === 'main') {
    const scenes = TIMELINE.main.scenes;
    const totalDur = TIMELINE.main.total_duration;
    let active = scenes[scenes.length - 1];
    for (const s of scenes) {
      if (t >= s.start && t <= s.end) {
        active = s;
        break;
      }
    }
    const localP = clamp((t - active.start) / Math.max(0.1, active.duration));
    drawTopBar(active.id, active.title, t, totalDur, mode);
    renderSceneById(active.id, localP, t);
    drawSubtitleBar(active.vo_text, localP);

    // Smooth 0.4s crossfade flash at scene boundaries
    const timeInScene = t - active.start;
    const timeLeft = active.end - t;
    if (timeInScene < 0.35 && active.id > 1) {
      ctx.fillStyle = `rgba(14, 16, 23, ${1 - timeInScene / 0.35})`;
      ctx.fillRect(0, 0, W, H);
    } else if (timeLeft < 0.35 && active.id === 11) {
      ctx.fillStyle = `rgba(0, 0, 0, ${1 - timeLeft / 0.35})`;
      ctx.fillRect(0, 0, W, H);
    }
  } else {
    const cut = TIMELINE.cuts[mode];
    if (!cut) return;
    const segs = cut.segments;
    const totalDur = cut.total_duration;
    let active = segs[segs.length - 1];
    for (const s of segs) {
      if (t >= s.start && t <= s.end) {
        active = s;
        break;
      }
    }
    const localP = clamp((t - active.start) / Math.max(0.1, active.duration));
    const sceneObj = TIMELINE.main.scenes.find(x => x.id === active.scene_id) || { title: 'Neurosymbolic XR' };
    drawTopBar(active.scene_id, sceneObj.title, t, totalDur, mode);
    renderSceneById(active.scene_id, localP, t);
    drawSubtitleBar(active.vo_text, localP);
  }
};

// Interactive Player Controls for Browser Viewing
let isPlaying = false;
let currentMode = 'main';
let currentTime = 0;
let lastFrameTs = 0;

const playBtn = document.getElementById('play-btn');
const modeSelect = document.getElementById('mode-select');
const scrub = document.getElementById('scrub');
const timeDisplay = document.getElementById('time-display');

function getModeDuration(m) {
  if (m === 'thumbnail') return 1;
  if (m === 'main') return TIMELINE.main.total_duration;
  return TIMELINE.cuts[m] ? TIMELINE.cuts[m].total_duration : 60;
}

function fmtSec(s) {
  const m = Math.floor(s / 60);
  const sec = (s % 60).toFixed(1).padStart(4, '0');
  return `${String(m).padStart(2, '0')}:${sec}`;
}

function updateUI() {
  const maxD = getModeDuration(currentMode);
  scrub.max = maxD;
  scrub.value = currentTime;
  timeDisplay.textContent = `${fmtSec(currentTime)} / ${fmtSec(maxD)}`;
  window.renderAtTime(currentTime, currentMode);
}

playBtn.addEventListener('click', () => {
  isPlaying = !isPlaying;
  playBtn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
  if (isPlaying) lastFrameTs = performance.now();
});

modeSelect.addEventListener('change', (e) => {
  currentMode = e.target.value;
  currentTime = 0;
  isPlaying = false;
  playBtn.textContent = '▶ Play';
  updateUI();
});

scrub.addEventListener('input', (e) => {
  currentTime = parseFloat(e.target.value);
  updateUI();
});

function tick(ts) {
  if (isPlaying) {
    const dt = (ts - lastFrameTs) / 1000;
    lastFrameTs = ts;
    const maxD = getModeDuration(currentMode);
    currentTime += dt;
    if (currentTime >= maxD) {
      currentTime = 0;
      isPlaying = false;
      playBtn.textContent = '▶ Play';
    }
    updateUI();
  }
  requestAnimationFrame(tick);
}

// Try loading scene_timings.json if opened directly via local server
fetch('./scene_timings.json')
  .then(r => r.json())
  .then(data => {
    window.setTimelineData(data);
    updateUI();
  })
  .catch(() => updateUI());

requestAnimationFrame(tick);
</script>
