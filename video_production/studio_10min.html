function roundRect(x, y, w, h, r, fill, stroke, lineWidth = 1.5) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
}

function drawPill(x, y, text, bg, fg, border = null, fontSize = 13) {
  ctx.font = `700 ${fontSize}px "JetBrains Mono", "SF Mono", monospace`;
  const padX = 12;
  const tw = ctx.measureText(text).width;
  const pw = tw + padX * 2;
  const ph = fontSize + 12;
  roundRect(x, y, pw, ph, 6, bg, border, 1);
  ctx.fillStyle = fg;
  ctx.fillText(text, x + padX, y + fontSize + 2);
  return pw;
}

function wrapText(text, x, y, maxWidth, lineHeight, color = '#e2e8f0', font = '500 16px Inter, sans-serif') {
  ctx.font = font;
  ctx.fillStyle = color;
  const words = text.split(' ');
  let line = '';
  let curY = y;
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i] + ' ';
    if (ctx.measureText(test).width > maxWidth && i > 0) {
      ctx.fillText(line.trim(), x, curY);
      line = words[i] + ' ';
      curY += lineHeight;
    } else {
      line = test;
    }
  }
  if (line.trim()) {
    ctx.fillText(line.trim(), x, curY);
    curY += lineHeight;
  }
  return curY;
}

function drawShotFrame(shotId, localProgress, x, y, w, h, radius = 14) {
  const fFloat = Math.max(0, Math.min(FRAMES_PER_SHOT - 1.001, localProgress * (FRAMES_PER_SHOT - 1)));
  const idx0 = Math.floor(fFloat);
  const idx1 = Math.min(FRAMES_PER_SHOT - 1, idx0 + 1);
  const alpha = fFloat - idx0;

  const k0 = `${shotId}_${String(idx0).padStart(2, '0')}`;
  const k1 = `${shotId}_${String(idx1).padStart(2, '0')}`;
  const img0 = imageCache[k0];
  const img1 = imageCache[k1];

  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.clip();

  if (img0) {
    ctx.drawImage(img0, x, y, w, h);
  } else {
    ctx.fillStyle = '#0a1324';
    ctx.fillRect(x, y, w, h);
  }
  if (img1 && idx1 !== idx0 && alpha > 0.01) {
    ctx.globalAlpha = alpha;
    ctx.drawImage(img1, x, y, w, h);
    ctx.globalAlpha = 1.0;
  }
  ctx.restore();
  roundRect(x, y, w, h, radius, null, 'rgba(0, 210, 255, 0.45)', 2);
}

function drawBottomTimeline(t, scene) {

  const barX = 40, barW = W - 80;
  const pct = Math.max(0, Math.min(1, t / 600.0));
  roundRect(barX, y + 11, barW, 8, 4, 'rgba(30, 41, 59, 0.9)', null);
  roundRect(barX, y + 11, Math.max(8, barW * pct), 8, 4, '#0ea5e9', null);

  for (const s of SCENES) {
    const sx = barX + (s.start / 600.0) * barW;
    ctx.fillStyle = t >= s.start ? '#34d399' : '#475569';
    ctx.fillRect(sx, y + 8, 2, 14);
  }
}

window.renderAtTime = function(t) {
  ctx.fillStyle = '#050914';
  ctx.fillRect(0, 0, W, H);

  let active = SCENES[0];
  for (const s of SCENES) {
    if (t >= s.start && t < s.end) {
      active = s;
      break;
    }
  }
  if (t >= 600.0) active = SCENES[SCENES.length - 1];

  const dur = Math.max(0.001, active.end - active.start);
  const localP = Math.max(0, Math.min(1, (t - active.start) / dur));

  drawTopBar(t, active);
  renderScene(t, active, localP);
  drawBottomTimeline(t, active);
};
